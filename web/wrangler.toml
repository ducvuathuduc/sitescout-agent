# SiteScout live demo — Cloudflare Workers (free plan) with static assets.
# Secret (set once, never committed):  wrangler secret put GEOAPIFY_KEY
name = "sitescout"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Static files are embedded into the script by web/build.mjs (worker/assets.gen.ts).

[[d1_databases]]
binding = "DB"
database_name = "sitescout-demo"
database_id = "d2247353-faf3-4515-9eb4-868b4d542225"

[ai]
binding = "AI"

[vars]
# Per-market daily budgets for API calls and map tiles (a tile costs 0.25 credit):
# 1,200 + 1,200 = 2,400 = 80 % of the Geoapify free plan (3,000 credits/day).
# A Bangkok run cannot eat the HCMC budget and vice versa. The rest is headroom
# for the account owner's own use and for the few calls that can pass the cap
# check at the same moment.
# (The old single DAILY_CREDIT_CAP var is retired — the Worker no longer reads it.)
DAILY_CREDIT_CAP_HCMC = "1200"
DAILY_CREDIT_CAP_BANGKOK = "1200"
PER_IP_CALL_CAP = "180"
# Extra ceiling for tiles inside each market's budget (2,500 tiles = 625 credits).
TILE_CAP = "2500"
