name: Feature request
description: Suggest a new question type, city, or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What decision are you trying to make?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Which Geoapify APIs or open data would answer it?
